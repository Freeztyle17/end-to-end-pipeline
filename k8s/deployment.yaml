apiVersion: apps/v1
kind: Deployment
metadata:
  name: app
  namespace: e2e-pipeline
  labels:
    app: e2e-pipeline
spec:
  replicas: 2
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: e2e-pipeline
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: e2e-pipeline
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: app
          # CI подменяет образ через `kubectl set image` на ghcr.io/<repo>:sha-<commit>
          image: e2e-pipeline:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: PORT
              value: "3000"
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
