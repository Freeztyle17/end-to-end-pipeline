name: Full CI/CD Pipeline

on:
  push:
    branches: [ main ]

permissions:
  contents: read
  packages: write

jobs:
  build-test-deploy:
    runs-on: self-hosted

    steps:
      - name: Mark repo directory as safe
        # Используем переменную github.workspace вместо жестко заданного пути
        run: git config --global --add safe.directory '${{ github.workspace }}'

      - name: Checkout code
        uses: actions/checkout@v4

      # --- 1. Тестирование ---
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      # --- 2. Сборка и пуш Docker-образа в ghcr.io ---
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      # --- 3. Сохранение артефактов в Upstash Blob ---
      - name: Upload reports to Upstash Blob
        shell: powershell
        env:
          UPSTASH_BLOB_TOKEN: ${{ secrets.UPSTASH_BLOB_TOKEN }}
        run: |
          npm install -g upstash
          
          # ИСПРАВЛЕНО: правильная команда 'credentials', а не 's3-credentials'
          # Переменная UPSTASH_BLOB_TOKEN уже в env, поэтому upstash подхватит её автоматически
          $credsJson = upstash blob credentials --format json | Out-String
          
          # Проверяем, что вернул JSON, а не ошибку
          if ($credsJson -match "error|Error") {
            Write-Error "Failed to get Upstash credentials: $credsJson"
            exit 1
          }
          
          $creds = $credsJson | ConvertFrom-Json
          
          $env:AWS_ACCESS_KEY_ID = $creds.accessKeyId
          $env:AWS_SECRET_ACCESS_KEY = $creds.secretAccessKey
          $env:AWS_SESSION_TOKEN = $creds.sessionToken
          $env:AWS_DEFAULT_REGION = if ($creds.region) { $creds.region } else { "auto" }
          $endpoint = $creds.endpoint
          $bucket = $creds.bucket
          
          # Отладка: посмотрим, что вообще есть в директории после тестов
          Write-Host "Checking for coverage directory..."
          Get-ChildItem -Force | Select-Object Name, Length, LastWriteTime
          
          if (Test-Path -Path "./coverage" -PathType Container) {
            Write-Host "Uploading coverage reports to $bucket..."
            aws s3 cp ./coverage "s3://$bucket/reports/${{ github.sha }}/coverage" `
              --recursive `
              --endpoint-url $endpoint
          } else {
            Write-Host "Warning: Directory './coverage' not found. Skipping upload."
            # Мы не делаем exit 1 здесь, чтобы пайплайн не падал из-за отсутствия coverage,
            # если это не является критичным. Если критично — раскомментируйте строку ниже:
            # exit 1
          }

      # --- 4. Деплой в Kubernetes (GitOps) ---
      - name: Update Kubernetes manifest (GitOps)
        shell: powershell # <-- ИЗМЕНЕНО: используем стандартный Windows PowerShell
        env:
          GITOPS_TOKEN: ${{ secrets.GITOPS_TOKEN }}
          IMAGE: ghcr.io/${{ github.repository }}:${{ github.sha }}
        run: |
          # Отключаем интерактивные запросы git
          $env:GIT_TERMINAL_PROMPT = 0
          
          # ЗАМЕНИТЕ 'your-username' на реальный логин владельца репозитория с манифестами
          git clone https://x-access-token:$env:GITOPS_TOKEN@github.com/your-username/my-app-manifests.git
          Set-Location my-app-manifests
          
          # Читаем файл, делаем замену по регулярному выражению и сохраняем
          $content = Get-Content -Path deployment.yaml -Raw
          $content = $content -replace 'image:\s*.*', "image: $env:IMAGE"
          Set-Content -Path deployment.yaml -Value $content
          
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add deployment.yaml
          git commit -m "chore: update image to $env:IMAGE"
          git push

      # --- 5. Уведомление в Пачку (заменяет Mattermost) ---
