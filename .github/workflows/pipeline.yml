name: Full CI/CD Pipeline

on:
  push:
    branches: [ main ]

permissions:
  contents: read
  packages: write

jobs:
  build-test-deploy:
    runs-on: self-hosted

    steps:
      - name: Mark repo directory as safe
        # Используем переменную github.workspace вместо жестко заданного пути
        run: git config --global --add safe.directory '${{ github.workspace }}'

      - name: Checkout code
        uses: actions/checkout@v4

      # --- 1. Тестирование ---
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test -- --coverage

      # --- 2. Сборка и пуш Docker-образа в ghcr.io ---
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      # --- 3. Сохранение артефактов в Upstash Blob ---
      - name: Upload reports to Upstash Blob
        shell: powershell
        env:
          UPSTASH_BLOB_TOKEN: ${{ secrets.UPSTASH_BLOB_TOKEN }}
        run: |
          # 1. Проверяем наличие папки coverage
          if (Test-Path -Path "./coverage" -PathType Container) {
            Write-Host "Installing AWS SDK for JavaScript..."
            npm install @aws-sdk/client-s3
            
            Write-Host "Fetching Upstash credentials..."
            # upstash blob credentials выводит JSON по умолчанию, флаг --format не нужен
            $credsJson = upstash blob credentials | Out-String
            $creds = $credsJson | ConvertFrom-Json
            
            # 2. Создаем небольшой Node.js скрипт для рекурсивной загрузки директории
            $uploadScript = @"
            const fs = require('fs');
            const path = require('path');
            const { S3Client, PutObjectCommand } = require('@aws-sdk/client-s3');
            
            const client = new S3Client({
              endpoint: process.env.ENDPOINT,
              region: process.env.AWS_DEFAULT_REGION || 'auto',
              credentials: {
                accessKeyId: process.env.AWS_ACCESS_KEY_ID,
                secretAccessKey: process.env.AWS_SECRET_ACCESS_KEY,
                sessionToken: process.env.AWS_SESSION_TOKEN,
              },
              forcePathStyle: true // Обязательно для S3-совместимых хранилищ
            });
            
            async function uploadDir(dir, prefix) {
              const files = fs.readdirSync(dir);
              for (const file of files) {
                const filePath = path.join(dir, file);
                const stat = fs.statSync(filePath);
                // Заменяем обратные слеши Windows на прямые для корректных ключей в S3
                const key = path.join(prefix, file).replace(/\\\\/g, '/'); 
                
                if (stat.isDirectory()) {
                  await uploadDir(filePath, key);
                } else {
                  console.log('Uploading:', key);
                  await client.send(new PutObjectCommand({
                    Bucket: process.env.BUCKET,
                    Key: key,
                    Body: fs.readFileSync(filePath)
                  }));
                }
              }
            }

            uploadDir('./coverage', 'reports/${{ github.sha }}/coverage')
              .then(() => console.log('Upload complete!'))
              .catch(err => { console.error('Upload failed:', err); process.exit(1); });
            "@
                        Set-Content -Path "upload.js" -Value $uploadScript
                        
            # 3. Передаем переменные окружения для Node.js скрипта
            $env:ENDPOINT = $creds.endpoint
            $env:BUCKET = $creds.bucket
            $env:AWS_ACCESS_KEY_ID = $creds.accessKeyId
            $env:AWS_SECRET_ACCESS_KEY = $creds.secretAccessKey
            $env:AWS_SESSION_TOKEN = $creds.sessionToken
            $env:AWS_DEFAULT_REGION = if ($creds.region) { $creds.region } else { "auto" }
            
            Write-Host "Starting upload to bucket: $env:BUCKET"
            node upload.js
            
          } else {
            Write-Host "Warning: Directory './coverage' not found. Skipping upload."
            Write-Host "TIP: Убедитесь, что ваши тесты генерируют отчет. Попробуйте изменить шаг тестов на: 'npm test -- --coverage'"
          }

      # --- 4. Деплой в Kubernetes (GitOps) ---
      - name: Update Kubernetes manifest (GitOps)
        shell: powershell # <-- ИЗМЕНЕНО: используем стандартный Windows PowerShell
        env:
          GITOPS_TOKEN: ${{ secrets.GITOPS_TOKEN }}
          IMAGE: ghcr.io/${{ github.repository }}:${{ github.sha }}
        run: |
          # Отключаем интерактивные запросы git
          $env:GIT_TERMINAL_PROMPT = 0
          
          # ЗАМЕНИТЕ 'your-username' на реальный логин владельца репозитория с манифестами
          git clone https://x-access-token:$env:GITOPS_TOKEN@github.com/your-username/my-app-manifests.git
          Set-Location my-app-manifests
          
          # Читаем файл, делаем замену по регулярному выражению и сохраняем
          $content = Get-Content -Path deployment.yaml -Raw
          $content = $content -replace 'image:\s*.*', "image: $env:IMAGE"
          Set-Content -Path deployment.yaml -Value $content
          
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add deployment.yaml
          git commit -m "chore: update image to $env:IMAGE"
          git push

      # --- 5. Уведомление в Пачку (заменяет Mattermost) ---
