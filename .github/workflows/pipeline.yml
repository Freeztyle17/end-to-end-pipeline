# Сквозной пайплайн: commit → CI → тесты → Docker → K8s → S3 → трекер
#
#   test ──► build ──► deploy (kind) ──► artifacts (S3/MinIO) ──► notify (GitHub Issues / Пачка)
#
# На pull_request: test + build (без push), деплой и уведомления пропускаются.
# На push в main / ручной запуск: полный конвейер.

name: Full CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: pipeline-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: '20'
  K8S_NAMESPACE: e2e-pipeline

jobs:
  # ---------------------------------------------------------------- 1. Тесты
  test:
    name: Lint & unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run test:ci

      - name: Coverage summary
        if: always()
        run: |
          if [ -f coverage/coverage-summary.json ]; then
            node -e '
              const t = require("./coverage/coverage-summary.json").total;
              console.log("### Coverage\n| metric | % |\n|---|---|");
              for (const k of ["lines","statements","functions","branches"]) console.log(`| ${k} | ${t[k].pct} |`);
            ' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          if-no-files-found: warn
          retention-days: 7

  # ------------------------------------------------- 2. Сборка Docker-образа
  build:
    name: Build & push image
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.vars.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      # ghcr требует lowercase, а владелец репозитория — Freeztyle17
      - name: Compute image name
        id: vars
        run: |
          repo="${GITHUB_REPOSITORY,,}"
          echo "repo=ghcr.io/${repo}" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${repo}:sha-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.vars.outputs.repo }}
          tags: |
            type=sha,format=long
            type=ref,event=branch
            type=ref,event=pr
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: APP_VERSION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ------------------------------------------------- 3. Деплой в Kubernetes
  deploy:
    name: Deploy to Kubernetes (kind)
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    env:
      IMAGE: ${{ needs.build.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - name: Create kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: e2e

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Пакет в ghcr может быть приватным — тянем образ раннером и грузим в kind
      - name: Load image into kind
        run: |
          docker pull "$IMAGE"
          kind load docker-image "$IMAGE" --name e2e

      - name: Apply manifests
        run: |
          kubectl apply -k k8s/
          kubectl -n "$K8S_NAMESPACE" set image deployment/app app="$IMAGE"
          kubectl -n "$K8S_NAMESPACE" annotate deployment/app \
            kubernetes.io/change-cause="CI ${GITHUB_SHA::7} run ${GITHUB_RUN_ID}" --overwrite
          kubectl -n "$K8S_NAMESPACE" rollout status deployment/app --timeout=120s

      - name: Smoke test
        run: |
          kubectl -n "$K8S_NAMESPACE" port-forward svc/app 8080:80 >/tmp/pf.log 2>&1 &
          for _ in $(seq 1 20); do curl -fs localhost:8080/health && break; sleep 1; done
          curl -fs localhost:8080/health | tee /dev/stderr | grep -q '"ok"'
          curl -fs localhost:8080/ | tee /dev/stderr | grep -q "$GITHUB_SHA"

      - name: Collect deploy report
        if: always()
        run: |
          mkdir -p deploy-report
          kubectl -n "$K8S_NAMESPACE" get all -o wide > deploy-report/resources.txt 2>&1 || true
          kubectl -n "$K8S_NAMESPACE" describe deployment/app > deploy-report/deployment.txt 2>&1 || true
          kubectl -n "$K8S_NAMESPACE" logs -l app=e2e-pipeline --tail=200 > deploy-report/logs.txt 2>&1 || true
          kubectl -n "$K8S_NAMESPACE" rollout history deployment/app > deploy-report/history.txt 2>&1 || true
          {
            echo "### Kubernetes"
            echo '```'
            cat deploy-report/resources.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deploy-report
          path: deploy-report/
          retention-days: 7

  # ------------------------------------------- 4. Артефакты в S3 (MinIO)
  # По умолчанию поднимается MinIO прямо в job'е (S3-совместимое хранилище).
  # Если заданы секреты S3_ENDPOINT / S3_ACCESS_KEY / S3_SECRET_KEY / S3_BUCKET —
  # загрузка идёт во внешний S3 (Yandex Object Storage, AWS, свой MinIO и т.п.).
  artifacts:
    name: Store artifacts in S3
    needs: [test, build, deploy]
    if: ${{ !cancelled() && github.event_name != 'pull_request' && needs.test.result != 'skipped' }}
    runs-on: ubuntu-latest
    env:
      EXT_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
      EXT_ACCESS_KEY: ${{ secrets.S3_ACCESS_KEY }}
      EXT_SECRET_KEY: ${{ secrets.S3_SECRET_KEY }}
      EXT_BUCKET: ${{ secrets.S3_BUCKET }}
    outputs:
      prefix: ${{ steps.upload.outputs.prefix }}
      target: ${{ steps.s3.outputs.target }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist/

      - name: Configure S3 target
        id: s3
        run: |
          if [ -n "$EXT_ENDPOINT" ]; then
            echo "Using external S3: $EXT_ENDPOINT"
            {
              echo "S3_ENDPOINT=$EXT_ENDPOINT"
              echo "AWS_ACCESS_KEY_ID=$EXT_ACCESS_KEY"
              echo "AWS_SECRET_ACCESS_KEY=$EXT_SECRET_KEY"
              echo "S3_BUCKET=${EXT_BUCKET:-ci-artifacts}"
            } >> "$GITHUB_ENV"
            echo "target=external" >> "$GITHUB_OUTPUT"
          else
            echo "Starting ephemeral MinIO"
            docker run -d --name minio -p 9000:9000 \
              -e MINIO_ROOT_USER=minioadmin -e MINIO_ROOT_PASSWORD=minioadmin \
              minio/minio server /data
            for _ in $(seq 1 30); do curl -fs localhost:9000/minio/health/live && break; sleep 1; done
            {
              echo "S3_ENDPOINT=http://localhost:9000"
              echo "AWS_ACCESS_KEY_ID=minioadmin"
              echo "AWS_SECRET_ACCESS_KEY=minioadmin"
              echo "S3_BUCKET=ci-artifacts"
            } >> "$GITHUB_ENV"
            echo "target=minio (ephemeral)" >> "$GITHUB_OUTPUT"
          fi
          echo "AWS_DEFAULT_REGION=us-east-1" >> "$GITHUB_ENV"

      - name: Upload to S3
        id: upload
        env:
          TEST_RESULT: ${{ needs.test.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
          IMAGE: ${{ needs.build.outputs.image }}
        run: |
          prefix="${GITHUB_REPOSITORY,,}/${GITHUB_SHA}"
          cat > dist/build-info.json <<JSON
          {
            "repository": "${GITHUB_REPOSITORY}",
            "sha": "${GITHUB_SHA}",
            "ref": "${GITHUB_REF}",
            "run_id": "${GITHUB_RUN_ID}",
            "run_url": "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}",
            "image": "${IMAGE}",
            "results": { "test": "${TEST_RESULT}", "build": "${BUILD_RESULT}", "deploy": "${DEPLOY_RESULT}" },
            "created_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          JSON
          aws --endpoint-url "$S3_ENDPOINT" s3 mb "s3://$S3_BUCKET" 2>/dev/null || true
          aws --endpoint-url "$S3_ENDPOINT" s3 cp dist/ "s3://$S3_BUCKET/$prefix/" --recursive
          echo "prefix=s3://$S3_BUCKET/$prefix/" >> "$GITHUB_OUTPUT"
          {
            echo "### S3 artifacts"
            echo '```'
            aws --endpoint-url "$S3_ENDPOINT" s3 ls "s3://$S3_BUCKET/$prefix/" --recursive
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

  # --------------------------------------------------- 5. Уведомление в трекер
  # Успех/провал пишется комментарием во все issue, упомянутые в коммитах (#12, fixes #12).
  # При провале на main заводится issue с меткой ci-failure (или дополняется открытый).
  # Если задан секрет PACHKA_WEBHOOK_URL — дублируется сообщение в Пачку.
  notify:
    name: Notify tracker
    needs: [test, build, deploy, artifacts]
    if: ${{ always() && github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Post to GitHub Issues
        id: gh
        uses: actions/github-script@v7
        env:
          RESULTS: ${{ toJSON(needs) }}
          IMAGE: ${{ needs.build.outputs.image }}
          S3_PREFIX: ${{ needs.artifacts.outputs.prefix }}
          S3_TARGET: ${{ needs.artifacts.outputs.target }}
        with:
          script: |
            const needs = JSON.parse(process.env.RESULTS);
            const ok = Object.values(needs).every(j => j.result === 'success');
            const sha = context.sha.slice(0, 7);
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const icon = r => ({ success: '✅', failure: '❌', skipped: '⏭️', cancelled: '🚫' }[r] || '❔');

            const body = [
              `${ok ? '✅ Pipeline passed' : '❌ Pipeline failed'} for \`${sha}\` ([run](${runUrl}))`,
              '',
              '| stage | result |', '|---|---|',
              ...Object.entries(needs).map(([k, v]) => `| ${k} | ${icon(v.result)} ${v.result} |`),
              '',
              process.env.IMAGE ? `**Image:** \`${process.env.IMAGE}\`` : '',
              process.env.S3_PREFIX ? `**Artifacts:** \`${process.env.S3_PREFIX}\` (${process.env.S3_TARGET})` : '',
            ].filter(Boolean).join('\n');

            const messages = (context.payload.commits || []).map(c => c.message)
              .concat(context.payload.head_commit ? [context.payload.head_commit.message] : []);
            const refs = [...new Set(messages.flatMap(m => [...m.matchAll(/#(\d+)/g)].map(x => Number(x[1]))))];

            for (const issue_number of refs) {
              try {
                await github.rest.issues.createComment({ ...context.repo, issue_number, body });
                core.info(`Commented on #${issue_number}`);
              } catch (e) {
                core.warning(`Cannot comment on #${issue_number}: ${e.message}`);
              }
            }

            if (!ok) {
              const label = 'ci-failure';
              try { await github.rest.issues.createLabel({ ...context.repo, name: label, color: 'd73a4a' }); } catch {}
              const open = await github.rest.issues.listForRepo({ ...context.repo, labels: label, state: 'open' });
              if (open.data.length) {
                await github.rest.issues.createComment({ ...context.repo, issue_number: open.data[0].number, body });
                core.info(`Updated failure issue #${open.data[0].number}`);
              } else {
                const { data } = await github.rest.issues.create({
                  ...context.repo, title: `CI failed on ${context.ref.replace('refs/heads/', '')} @ ${sha}`,
                  body, labels: [label],
                });
                core.info(`Created failure issue #${data.number}`);
              }
            }

            await core.summary.addRaw(body).write();
            core.setOutput('status', ok ? 'success' : 'failure');
            core.setOutput('text', body);

      - name: Notify Pachka
        env:
          PACHKA_WEBHOOK_URL: ${{ secrets.PACHKA_WEBHOOK_URL }}
          TEXT: ${{ steps.gh.outputs.text }}
        run: |
          if [ -z "$PACHKA_WEBHOOK_URL" ]; then
            echo "PACHKA_WEBHOOK_URL not set — skipping"; exit 0
          fi
          jq -n --arg m "$TEXT" '{message: $m}' \
            | curl -fsS -X POST -H 'Content-Type: application/json' --data @- "$PACHKA_WEBHOOK_URL"
