name: Full CI/CD Pipeline

on:
  push:
    branches: [ main ]

permissions:
  contents: read
  packages: write

jobs:
  build-test-deploy:
    runs-on: self-hosted

    steps:
      - name: Mark repo directory as safe
        run: git config --global --add safe.directory 'C:/actions-runner/_work/end-to-end-pipeline/end-to-end-pipeline'

      - name: Checkout code
        uses: actions/checkout@v4

      # --- 1. Тестирование ---
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      # --- 2. Сборка и пуш Docker-образа в ghcr.io ---
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      # --- 3. Сохранение артефактов в Upstash Blob ---
      - name: Upload reports to Upstash Blob
        env:
          UPSTASH_BLOB_TOKEN: ${{ secrets.UPSTASH_BLOB_TOKEN }}
        run: |
          npm install -g upstash-cli
          CREDS=$(upstash blob s3-credentials --token "$UPSTASH_BLOB_TOKEN" --format json)
          export AWS_ACCESS_KEY_ID=$(echo "$CREDS" | jq -r '.accessKeyId')
          export AWS_SECRET_ACCESS_KEY=$(echo "$CREDS" | jq -r '.secretAccessKey')
          export AWS_SESSION_TOKEN=$(echo "$CREDS" | jq -r '.sessionToken')
          export AWS_DEFAULT_REGION=$(echo "$CREDS" | jq -r '.region // "auto"')
          ENDPOINT=$(echo "$CREDS" | jq -r '.endpoint')
          BUCKET=$(echo "$CREDS" | jq -r '.bucket')
          if [ -d "./coverage" ]; then
            aws s3 cp ./coverage "s3://$BUCKET/reports/${{ github.sha }}/coverage" \
              --recursive \
              --endpoint-url "$ENDPOINT"
          fi

      # --- 4. Деплой в Kubernetes (GitOps) ---
      - name: Update Kubernetes manifest (GitOps)
        env:
          GITOPS_TOKEN: ${{ secrets.GITOPS_PAT }}
          IMAGE: ghcr.io/${{ github.repository }}:${{ github.sha }}
        run: |
          git clone https://x-access-token:${{ secrets.GITOPS_TOKEN }}@github.com/your-username/my-app-manifests.git
          cd my-app-manifests
          sed -i "s|image: .*|image: $IMAGE|g" deployment.yaml
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add deployment.yaml
          git commit -m "Update image to ${{ github.sha }}"
          git push

      # --- 5. Уведомление в Пачку (заменяет Mattermost) ---
